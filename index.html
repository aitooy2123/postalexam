<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Postal Success - แพลตฟอร์มเตรียมสอบนักเรียนการไปรษณีย์</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Anuphan', sans-serif; background-color: #f8fafc; }
        .postal-red { color: #e31e24; }
        .bg-postal-red { background-color: #e31e24; }
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
        .card-hover { transition: all 0.3s ease; }
        .card-hover:hover { transform: translateY(-5px); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); }
        @keyframes pulse-red { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .animate-pulse-red { animation: pulse-red 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    </style>
</head>
<body class="text-slate-900">

    <!-- App Root -->
    <div id="app">
        <!-- Navigation -->
        <nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-gray-100">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between h-16 items-center">
                    <div class="flex items-center gap-2 cursor-pointer" onclick="router.navigate('home')">
                        <div class="bg-postal-red p-1.5 rounded-lg flex items-center justify-center">
                            <i data-lucide="send" class="text-white w-5 h-5"></i>
                        </div>
                        <span class="text-xl font-bold tracking-tighter">POSTAL <span class="text-postal-red">SUCCESS</span></span>
                    </div>
                    
                    <div class="hidden md:flex space-x-8 text-sm font-medium text-slate-600">
                        <button onclick="router.navigate('home')" class="hover:text-postal-red transition-colors">หน้าหลัก</button>
                        <button onclick="router.navigate('shop')" class="hover:text-postal-red transition-colors">ซื้อแนวข้อสอบ</button>
                        <button onclick="router.navigate('exam')" class="hover:text-postal-red transition-colors">ทดลองสอบ</button>
                        <button onclick="router.navigate('jobs')" class="hover:text-postal-red transition-colors">รับสมัครงาน</button>
                        <button onclick="router.navigate('interview')" class="hover:text-postal-red transition-colors text-blue-600 font-bold">AI Interview</button>
                    </div>

                    <div class="flex items-center gap-4">
                        <div class="relative cursor-pointer" onclick="router.navigate('cart')">
                            <i data-lucide="shopping-cart" class="w-6 h-6 text-slate-400"></i>
                            <span id="cart-count" class="absolute -top-2 -right-2 bg-postal-red text-white text-[10px] rounded-full w-5 h-5 flex items-center justify-center border-2 border-white">0</span>
                        </div>
                        <button id="login-btn" onclick="router.navigate('login')" class="bg-slate-900 text-white px-5 py-2 rounded-full text-sm font-medium hover:bg-slate-800 transition-all">
                            เข้าสู่ระบบ
                        </button>
                    </div>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <div id="view-content" class="min-h-[calc(100vh-64px)]">
            <!-- Content will be injected here -->
        </div>

        <!-- Floating AI Assistant -->
        <div class="fixed bottom-6 right-6 z-40">
            <button onclick="toggleAI()" class="bg-postal-red text-white p-4 rounded-full shadow-2xl hover:scale-110 transition-transform flex items-center justify-center">
                <i data-lucide="bot" class="w-6 h-6"></i>
            </button>
            <div id="ai-chat" class="hidden absolute bottom-20 right-0 w-80 bg-white rounded-2xl shadow-2xl border border-gray-100 overflow-hidden animate-in">
                <div class="bg-postal-red p-4 text-white flex justify-between items-center">
                    <div class="flex items-center gap-2">
                        <i data-lucide="sparkles" class="w-4 h-4"></i>
                        <span class="font-bold text-sm">ผู้ช่วยส่วนตัว (ระเบียบการสอบ)</span>
                    </div>
                    <button onclick="toggleAI()"><i data-lucide="x" class="w-4 h-4"></i></button>
                </div>
                <div id="ai-messages" class="h-64 overflow-y-auto p-4 space-y-3 text-sm">
                    <div class="bg-slate-100 p-3 rounded-2xl rounded-tl-none text-slate-700">สวัสดีครับ ผมคือผู้ช่วยด้านระเบียบการสอบนักเรียนการไปรษณีย์ สอบถามเรื่องวุฒิ อายุ หรือวิชาที่ใช้สอบได้เลยครับ!</div>
                </div>
                <div class="p-3 border-t flex gap-2">
                    <input type="text" id="ai-input" placeholder="พิมพ์คำถามของคุณ..." class="flex-1 text-sm border-none focus:ring-0">
                    <button onclick="askAI()" class="text-postal-red"><i data-lucide="send-horizontal" class="w-5 h-5"></i></button>
                </div>
            </div>
        </div>
    </div>

    <!-- UI Components Definitions -->
    <script>
        const API_KEY = ""; // Placeholder for Gemini API
        
        // --- State Management ---
        let state = {
            cart: [],
            currentUser: null,
            isAdmin: false,
            jobs: [
                { id: 1, title: 'นักเรียนการไปรษณีย์ ประจำปี 2568', date: '1 เม.ย. - 15 พ.ค. 68', gender: 'ช/ญ', amount: 300, link: '#' },
                { id: 2, title: 'พนักงานขับรถขนส่งพัสดุ', date: '10 มี.ค. - 30 มี.ค. 68', gender: 'ชาย', amount: 50, link: '#' }
            ],
            products: [
                { id: 1, name: 'แนวข้อสอบนักเรียนการไปรษณีย์ 2568', price: 399, difficulty: 'ปานกลาง', subjects: '5 วิชาหลัก', version: '2025' },
                { id: 2, name: 'ชุดตะลุยโจทย์ Speed Test', price: 199, difficulty: 'ยาก', subjects: 'คณิต/ไทย', version: '2025' }
            ],
            banks: [
                { id: 1, name: 'ธนาคารกสิกรไทย', color: 'bg-green-600', logo: 'K', type: 'commercial' },
                { id: 2, name: 'ธนาคารไทยพาณิชย์', color: 'bg-purple-700', logo: 'S', type: 'commercial' },
                { id: 3, name: 'ธนาคารออมสิน', color: 'bg-pink-600', logo: 'GSB', type: 'state' }
            ]
        };

        // --- Router ---
        const router = {
            navigate: function(page) {
                const content = document.getElementById('view-content');
                window.scrollTo(0,0);
                
                switch(page) {
                    case 'home': content.innerHTML = templates.home(); break;
                    case 'shop': content.innerHTML = templates.shop(); break;
                    case 'exam': content.innerHTML = templates.exam(); break;
                    case 'jobs': content.innerHTML = templates.jobs(); break;
                    case 'cart': content.innerHTML = templates.cart(); break;
                    case 'login': content.innerHTML = templates.login(); break;
                    case 'interview': content.innerHTML = templates.interview(); break;
                    case 'admin': content.innerHTML = templates.admin(); break;
                    case 'payment': content.innerHTML = templates.payment(); break;
                    case 'result': content.innerHTML = templates.result(); break;
                }
                lucide.createIcons();
            }
        };

        // --- Templates ---
        const templates = {
            home: () => `
                <div class="animate-in fade-in duration-500">
                    <!-- Hero Section -->
                    <section class="relative bg-slate-900 py-24 px-6 overflow-hidden">
                        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center gap-12 relative z-10">
                            <div class="flex-1 text-white space-y-8">
                                <div class="inline-flex items-center gap-2 bg-postal-red/20 text-postal-red border border-postal-red/30 px-4 py-1.5 rounded-full text-xs font-bold uppercase tracking-widest">
                                    <i data-lucide="zap" class="w-3 h-3"></i> รวบรวมโดยรุ่นพี่ประสบการณ์ 10 ปี
                                </div>
                                <h1 class="text-5xl md:text-7xl font-black leading-tight">เล่มเดียวครบ <span class="text-postal-red">5 วิชา</span><br>สอบติดไปรษณีย์</h1>
                                <p class="text-slate-400 text-lg max-w-xl">จำหน่ายแนวข้อสอบนักเรียนการไปรษณีย์ รวบรวมโดยรุ่นพี่ที่ทำงานจริง ครอบคลุมทั้งความรู้ทั่วไปและ Personality Test</p>
                                <div class="flex flex-wrap gap-4 pt-4">
                                    <button onclick="router.navigate('shop')" class="bg-postal-red hover:bg-red-700 text-white px-8 py-4 rounded-2xl font-bold flex items-center gap-2 transition-all">
                                        ซื้อแนวข้อสอบทันที <i data-lucide="arrow-right" class="w-5 h-5"></i>
                                    </button>
                                    <button onclick="router.navigate('exam')" class="bg-white/10 hover:bg-white/20 text-white px-8 py-4 rounded-2xl font-bold border border-white/10 backdrop-blur-sm transition-all">
                                        ทดลองทำข้อสอบฟรี
                                    </button>
                                </div>
                            </div>
                            <div class="flex-1 relative">
                                <div class="absolute -inset-4 bg-postal-red/20 blur-3xl rounded-full"></div>
                                <div class="bg-white p-8 rounded-[3rem] shadow-2xl relative rotate-3 card-hover">
                                    <div class="bg-slate-50 aspect-[3/4] rounded-2xl flex flex-col items-center justify-center p-6 border-4 border-slate-100">
                                        <div class="bg-postal-red p-4 rounded-3xl mb-6 shadow-xl"><i data-lucide="mail-open" class="text-white w-12 h-12"></i></div>
                                        <h3 class="text-2xl font-black text-slate-800 text-center">แนวข้อสอบ<br>นักเรียนการไปรษณีย์</h3>
                                        <div class="mt-4 flex gap-1">
                                            <i data-lucide="star" class="text-yellow-400 fill-yellow-400 w-4 h-4"></i>
                                            <i data-lucide="star" class="text-yellow-400 fill-yellow-400 w-4 h-4"></i>
                                            <i data-lucide="star" class="text-yellow-400 fill-yellow-400 w-4 h-4"></i>
                                            <i data-lucide="star" class="text-yellow-400 fill-yellow-400 w-4 h-4"></i>
                                            <i data-lucide="star" class="text-yellow-400 fill-yellow-400 w-4 h-4"></i>
                                        </div>
                                        <p class="text-xs text-slate-400 mt-2 font-bold uppercase tracking-widest">ฉบับปรับปรุง 2568</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>

                    <!-- Subjects Section -->
                    <section class="py-24 max-w-7xl mx-auto px-6">
                        <div class="text-center mb-16 space-y-4">
                            <h2 class="text-3xl font-black">เนื้อหาครอบคลุมทุกหมวดหมู่</h2>
                            <p class="text-slate-500">รวบรวมวิชาที่ใช้สอบจริงตามระเบียบการล่าสุด</p>
                        </div>
                        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-6">
                            ${['คณิตศาสตร์', 'ภาษาไทย', 'ภาษาอังกฤษ', 'คอมพิวเตอร์ (Digital)', 'ทัศนคติ', 'ความถนัดปัญญา'].map(s => `
                                <div class="bg-white p-6 rounded-3xl border border-slate-100 text-center card-hover">
                                    <div class="bg-slate-50 w-12 h-12 rounded-2xl flex items-center justify-center mx-auto mb-4 text-postal-red">
                                        <i data-lucide="check-circle-2" class="w-6 h-6"></i>
                                    </div>
                                    <span class="text-sm font-bold">${s}</span>
                                </div>
                            `).join('')}
                        </div>
                    </section>
                </div>
            `,

            shop: () => `
                <div class="max-w-7xl mx-auto py-12 px-6">
                    <div class="flex flex-col md:flex-row justify-between items-end mb-12 gap-6">
                        <div class="space-y-2">
                            <h2 class="text-4xl font-black">คลังแนวข้อสอบ</h2>
                            <p class="text-slate-500">เลือกชุดข้อสอบที่คุณต้องการฝึกฝน</p>
                        </div>
                        <div class="flex gap-4">
                            <div class="relative">
                                <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 w-4 h-4"></i>
                                <input type="text" placeholder="ค้นหาชุดข้อสอบ..." class="pl-11 pr-6 py-3 bg-white border border-slate-200 rounded-2xl text-sm focus:ring-2 focus:ring-postal-red/20 outline-none">
                            </div>
                        </div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                        ${state.products.map(p => `
                            <div class="bg-white rounded-[2.5rem] p-8 border border-slate-100 shadow-sm card-hover flex flex-col">
                                <div class="bg-slate-100 aspect-video rounded-3xl mb-6 flex items-center justify-center text-slate-300">
                                    <i data-lucide="book-open" class="w-12 h-12"></i>
                                </div>
                                <div class="flex justify-between items-start mb-2">
                                    <span class="bg-slate-100 text-slate-500 text-[10px] font-bold uppercase px-3 py-1 rounded-full">${p.version}</span>
                                    <span class="text-postal-red text-[10px] font-black uppercase tracking-widest">${p.difficulty}</span>
                                </div>
                                <h3 class="text-xl font-black mb-4">${p.name}</h3>
                                <div class="flex items-center gap-2 mb-8 text-sm text-slate-500">
                                    <i data-lucide="layers" class="w-4 h-4"></i> ${p.subjects}
                                </div>
                                <div class="mt-auto flex items-center justify-between">
                                    <div>
                                        <p class="text-[10px] text-slate-400 font-bold uppercase">ราคา</p>
                                        <p class="text-2xl font-black">฿${p.price}</p>
                                    </div>
                                    <button onclick="actions.addToCart(${p.id})" class="bg-slate-900 text-white p-4 rounded-2xl hover:bg-postal-red transition-all shadow-lg">
                                        <i data-lucide="plus" class="w-5 h-5"></i>
                                    </button>
                                </div>
                            </div>
                        `).join('')}
                        <!-- Free Item -->
                        <div class="bg-blue-600 rounded-[2.5rem] p-8 text-white shadow-xl shadow-blue-200 card-hover flex flex-col">
                            <div class="bg-white/10 aspect-video rounded-3xl mb-6 flex items-center justify-center text-white/50">
                                <i data-lucide="file-down" class="w-12 h-12"></i>
                            </div>
                            <h3 class="text-xl font-black mb-4">ชุดติวฟรีพื้นฐาน PDF</h3>
                            <p class="text-blue-100 text-sm mb-8">สมัครสมาชิกรับทันที ไฟล์แนวข้อสอบพื้นฐาน 50 ข้อ พร้อมเฉลย</p>
                            <button onclick="router.navigate('login')" class="mt-auto bg-white text-blue-600 py-4 rounded-2xl font-black text-center">รับไฟล์ฟรี</button>
                        </div>
                    </div>
                </div>
            `,

            cart: () => {
                const total = state.cart.reduce((sum, item) => sum + item.price, 0);
                if (state.cart.length === 0) return `
                    <div class="flex flex-col items-center justify-center py-24 px-6 space-y-6">
                        <div class="bg-slate-100 p-10 rounded-full text-slate-300"><i data-lucide="shopping-basket" class="w-16 h-16"></i></div>
                        <h2 class="text-2xl font-black">ตะกร้าของคุณยังว่างอยู่</h2>
                        <button onclick="router.navigate('shop')" class="bg-postal-red text-white px-8 py-3 rounded-2xl font-bold">ไปเลือกซื้อข้อสอบ</button>
                    </div>
                `;
                return `
                    <div class="max-w-4xl mx-auto py-12 px-6">
                        <h2 class="text-3xl font-black mb-10">ตะกร้าสินค้า (${state.cart.length})</h2>
                        <div class="grid md:grid-cols-3 gap-10">
                            <div class="md:col-span-2 space-y-4">
                                ${state.cart.map((item, idx) => `
                                    <div class="bg-white p-6 rounded-3xl border border-slate-100 flex items-center justify-between">
                                        <div class="flex items-center gap-4">
                                            <div class="bg-slate-50 w-16 h-16 rounded-2xl flex items-center justify-center text-postal-red"><i data-lucide="book" class="w-6 h-6"></i></div>
                                            <div>
                                                <h4 class="font-bold">${item.name}</h4>
                                                <p class="text-xs text-slate-400">1 ชุด</p>
                                            </div>
                                        </div>
                                        <div class="text-right">
                                            <p class="font-black">฿${item.price}</p>
                                            <button onclick="actions.removeFromCart(${idx})" class="text-slate-400 hover:text-red-500 transition-colors text-xs font-bold underline">ลบออก</button>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                            <div class="bg-slate-900 rounded-[2.5rem] p-8 text-white h-fit sticky top-24">
                                <h3 class="text-lg font-bold mb-6 border-b border-white/10 pb-4">สรุปการสั่งซื้อ</h3>
                                <div class="space-y-3 mb-10">
                                    <div class="flex justify-between text-slate-400 text-sm"><span>ยอดรวม</span><span>฿${total}</span></div>
                                    <div class="flex justify-between text-slate-400 text-sm"><span>ส่วนลด</span><span>฿0</span></div>
                                    <div class="flex justify-between text-xl font-black mt-4 pt-4 border-t border-white/10"><span>สุทธิ</span><span class="text-postal-red">฿${total}</span></div>
                                </div>
                                <button onclick="router.navigate('payment')" class="w-full bg-postal-red py-4 rounded-2xl font-black shadow-xl shadow-red-900/20 hover:scale-105 transition-transform">ชำระเงิน</button>
                            </div>
                        </div>
                    </div>
                `;
            },

            payment: () => {
                const total = state.cart.reduce((sum, item) => sum + item.price, 0);
                const decimal = (Math.random() * 0.99).toFixed(2).split('.')[1];
                const finalAmount = total + (parseFloat(decimal) / 100);
                return `
                    <div class="max-w-xl mx-auto py-12 px-6">
                        <div class="bg-white rounded-[3rem] shadow-2xl overflow-hidden animate-in zoom-in-95 duration-300">
                            <div class="bg-postal-red p-10 text-center text-white">
                                <p class="text-[10px] font-black uppercase tracking-widest opacity-80 mb-2">สแกนเพื่อชำระเงิน</p>
                                <h2 class="text-4xl font-black">฿${finalAmount.toFixed(2)}</h2>
                                <p class="text-xs mt-2 opacity-80">กรุณาโอนยอดตามทศนิยมเพื่อการตรวจสอบอัตโนมัติ</p>
                            </div>
                            <div class="p-10 space-y-8">
                                <div class="bg-slate-50 aspect-square rounded-[2rem] border-2 border-dashed border-slate-200 flex flex-col items-center justify-center p-8 relative">
                                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=00020101021130320016010111111111111111115802TH" class="w-full opacity-50 grayscale">
                                    <div class="absolute inset-0 flex flex-col items-center justify-center bg-white/40 backdrop-blur-sm">
                                        <div class="bg-white p-4 rounded-3xl shadow-xl">
                                            <i data-lucide="qr-code" class="w-16 h-16 text-slate-900"></i>
                                        </div>
                                        <p class="mt-4 font-bold text-slate-800">PromptPay QR Code</p>
                                    </div>
                                </div>

                                <div class="grid grid-cols-2 gap-4">
                                    <div class="space-y-2">
                                        <label class="text-[10px] font-bold text-slate-400 uppercase">เลือกธนาคารที่โอน</label>
                                        <select class="w-full bg-slate-50 border-none rounded-xl text-sm p-3 focus:ring-2 focus:ring-postal-red/20 outline-none">
                                            ${state.banks.map(b => `<option>${b.name}</option>`).join('')}
                                        </select>
                                    </div>
                                    <div class="space-y-2">
                                        <label class="text-[10px] font-bold text-slate-400 uppercase">เวลาที่โอน</label>
                                        <input type="time" class="w-full bg-slate-50 border-none rounded-xl text-sm p-3 focus:ring-2 focus:ring-postal-red/20 outline-none">
                                    </div>
                                </div>

                                <button onclick="actions.simulatePayment()" id="pay-btn" class="w-full bg-slate-900 text-white py-5 rounded-[2rem] font-black text-lg flex items-center justify-center gap-3 transition-all active:scale-95">
                                    <i data-lucide="check-circle" class="w-6 h-6"></i> แจ้งโอนเงินทันที
                                </button>
                                
                                <div id="verifying" class="hidden flex flex-col items-center gap-4 text-center">
                                    <div class="w-12 h-12 border-4 border-postal-red border-t-transparent rounded-full animate-spin"></div>
                                    <p class="text-sm font-bold text-slate-600 animate-pulse-red">กำลังตรวจสอบสถานะการโอนเงินอัตโนมัติ...</p>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            },

            exam: () => `
                <div class="max-w-4xl mx-auto py-12 px-6">
                    <div id="exam-start" class="bg-white rounded-[3rem] p-12 border border-slate-100 shadow-sm text-center space-y-8 animate-in">
                        <div class="bg-slate-50 w-24 h-24 rounded-[2rem] flex items-center justify-center mx-auto text-postal-red">
                            <i data-lucide="clipboard-list" class="w-12 h-12"></i>
                        </div>
                        <div>
                            <h2 class="text-3xl font-black">ระบบทดลองสอบเสมือนจริง</h2>
                            <p class="text-slate-500 mt-2">วิชาละ 5 ข้อ รวม 30 ข้อ • เวลา 45 นาที</p>

                if(msg.includes("อายุ")) reply = "สำหรับการสอบนักเรียนการไปรษณีย์ ผู้สมัครต้องมีอายุระหว่าง 18 - 25 ปีบริบูรณ์ ณ วันที่เปิดรับสมัครครับ";
                if(msg.includes("วุฒิ")) reply = "คุณสมบัติด้านการศึกษา ต้องสำเร็จการศึกษามัธยมศึกษาตอนปลาย (ม.6) หรือ ปวช. ทุกสาขาที่รับรองโดย ก.พ. ครับ";
                
                box.innerHTML += `<div class="bg-slate-100 p-3 rounded-2xl rounded-tl-none text-slate-700">${reply}</div>`;
                box.scrollTop = box.scrollHeight;
            }, 800);
        }

        // Initialize App
        window.onload = () => {
            router.navigate('home');
            lucide.createIcons();
        };
    </script>
</body>
