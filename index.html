<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Postal Exam System</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

<style>
body { font-family: sans-serif; }
.page-transition { animation: fade .3s ease; }
@keyframes fade { from{opacity:0} to{opacity:1} }
</style>
</head>

<body class="bg-slate-50">

<!-- FLOAT BTN -->
<div class="fixed bottom-5 right-5 z-50 flex gap-2">
<button onclick="switchView('user')" class="bg-black text-white px-4 py-2 rounded">User</button>
<button onclick="switchView('admin')" class="bg-red-600 text-white px-4 py-2 rounded">Admin</button>
</div>

<!-- USER -->
<div id="user-system">

<nav class="bg-white p-4 flex justify-between">
<b>PostalExam</b>
<div id="cart">🛒 <span id="cart-count">0</span></div>
</nav>

<div id="user-content" class="p-6"></div>

</div>

<!-- ADMIN -->
<div id="admin-system" class="hidden p-10">
<h1 class="text-2xl font-bold">Admin Panel</h1>
<p>ระบบหลังบ้านใช้งานได้</p>
</div>

<script>

// DATA
const products = [
 {name:"หนังสือสอบ", price:450},
 {name:"คอร์ส", price:1500}
];

// SWITCH
function switchView(v){
 document.getElementById('user-system').classList.toggle('hidden', v!=='user');
 document.getElementById('admin-system').classList.toggle('hidden', v!=='admin');
}

// RENDER HOME
function renderHome(){
 document.getElementById('user-content').innerHTML = `
 <h1 class="text-3xl font-bold mb-4">หน้าแรก</h1>
 <button onclick="renderShop()" class="bg-red-600 text-white px-4 py-2 rounded">ไป Shop</button>
 `;
}

// SHOP
let cart=0;
function renderShop(){
 document.getElementById('user-content').innerHTML = `
 <h1 class="text-3xl mb-4">Shop</h1>
 ${products.map((p,i)=>`
   <div class="bg-white p-4 mb-2 flex justify-between">
    ${p.name} - ฿${p.price}
    <button onclick="addCart()" class="bg-black text-white px-3">+</button>
   </div>
 `).join("")}
 `;
}

// CART
function addCart(){
 cart++;
 document.getElementById('cart-count').innerText = cart;
}

// INIT (สำคัญมาก)
document.addEventListener("DOMContentLoaded", ()=>{
 renderHome();
});

</script>

</body>
</html>
